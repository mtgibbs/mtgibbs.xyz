name: Deploy and Publish

on:
  push:
    branches:
      - mater
      - 'ci/github-actions'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  prepare:
    name: Prepare Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set-version.outputs.version }}
    steps:
      - id: set-version
        run: echo "version=$(date +'%Y%m%d%H%M%S')" >> "$GITHUB_OUTPUT"

  heroku-deploy:
    name: Deploy to Heroku
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Heroku
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          HEROKU_APP_NAME: ${{ secrets.HEROKU_APP_NAME }}
          APP_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          # Install Heroku CLI
          curl https://cli-assets.heroku.com/install.sh | sh
          
          # Login to Heroku Container Registry
          echo $HEROKU_API_KEY | docker login --username=_ --password-stdin registry.heroku.com
          
          # Build Image
          echo "${{ secrets.GH_ACCESS_TOKEN }}" > secret_token.txt
          docker build --build-arg NEXT_PUBLIC_VERSION=$APP_VERSION --secret id=GITHUB_ACCESS_TOKEN,src=secret_token.txt -t registry.heroku.com/$HEROKU_APP_NAME/web .
          rm secret_token.txt
          
          # Push Image
          docker push registry.heroku.com/$HEROKU_APP_NAME/web
          
          # Release
          heroku container:release web --app $HEROKU_APP_NAME

      - name: Purge Cloudflare Cache
        env:
          CLOUDFLARE_ZONE: ${{ secrets.CLOUDFLARE_ZONE }}
          CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
        run: |
          curl -X POST "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE/purge_cache" \
          -H "Authorization: Bearer $CLOUDFLARE_TOKEN" \
          -H "Content-Type: application/json" \
          --data '{"purge_everything":true}'

  ghcr-publish:
    name: Build and Push to GHCR
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=${{ needs.prepare.outputs.version }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_VERSION=${{ needs.prepare.outputs.version }}
          secrets: |
            GITHUB_ACCESS_TOKEN=${{ secrets.GH_ACCESS_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
