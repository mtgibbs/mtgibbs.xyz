<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PROTO F — NAV Radar (3D Star Chart)</title>
<style>
  @font-face { font-family:'Heavitas'; src:url('/fonts/Heavitas.ttf'); }
  @font-face { font-family:'Nineteen'; src:url('/fonts/NineteenNinetySeven-11XB.ttf'); }
  :root{
    --black:#1A1A1A; --card:#F5F0E1; --amber:#FFB000;
    --orange:#FF4400; --red:#D93636; --blue:#3B5C7D;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:var(--black);color:var(--card);
    font-family:'Nineteen',monospace;min-height:100vh;padding:26px;
  }
  body::before{
    content:'';position:fixed;inset:0;z-index:40;pointer-events:none;
    background:repeating-linear-gradient(0deg, transparent 0 3px, rgba(0,0,0,.30) 3px 4px);
  }

  .frame{max-width:1080px;margin:0 auto;border:1px solid rgba(245,240,225,.25)}
  .mn{display:flex;align-items:stretch;border-bottom:1px solid rgba(245,240,225,.25)}
  .mn b{font-family:'Heavitas';font-size:22px;padding:8px 14px;color:var(--black);background:var(--blue);color:var(--card)}
  .mn span{align-self:center;padding:0 12px;font-size:10px;letter-spacing:.3em;color:rgba(245,240,225,.6);text-transform:uppercase}
  .mn .st{margin-left:auto;align-self:center;padding:0 16px;font-size:11px;letter-spacing:.24em;color:var(--amber)}
  .mn .st.lock{color:var(--orange)}

  .grid{display:grid;grid-template-columns:1.6fr 1fr;min-height:520px}
  @media(max-width:820px){.grid{grid-template-columns:1fr}}

  .scope{position:relative;border-right:1px solid rgba(245,240,225,.25)}
  canvas{display:block;width:100%;height:100%;min-height:520px}

  .side{display:flex;flex-direction:column}
  .target{padding:22px 20px;border-bottom:1px solid rgba(245,240,225,.15);flex:1}
  .target .tg-name{font-family:'Heavitas';font-size:24px;color:var(--amber);min-height:30px}
  .target .row{display:flex;justify-content:space-between;font-size:12px;letter-spacing:.18em;padding:9px 0;border-bottom:1px solid rgba(245,240,225,.1)}
  .target .row b{font-weight:normal;color:rgba(245,240,225,.55);font-size:10px;letter-spacing:.28em}
  .target .row span{color:var(--card)}
  .target .row .hot{color:var(--orange)}
  .keys{display:flex;gap:10px;padding:16px 20px}
  .key{
    font-family:'Heavitas';font-size:12px;letter-spacing:.08em;
    background:transparent;color:var(--card);border:2px solid rgba(245,240,225,.4);
    padding:9px 16px;cursor:pointer;flex:1;
  }
  .key:hover{border-color:var(--amber);color:var(--amber)}
  .log{padding:12px 20px;font-size:11px;line-height:1.9;color:rgba(245,240,225,.55);border-top:1px solid rgba(245,240,225,.15);letter-spacing:.06em;min-height:76px}
  .log .a{color:var(--amber)}
</style>
</head>
<body>
  <div class="frame">
    <div class="mn">
      <b>NAV</b><span>Project Star Chart — Sweep &amp; Lock</span>
      <span class="st" id="state">SCANNING</span>
    </div>
    <div class="grid">
      <div class="scope"><canvas id="cv"></canvas></div>
      <div class="side">
        <div class="target">
          <div class="tg-name" id="tName">—</div>
          <div class="row"><b>DESIGNATION</b><span id="tDes">—</span></div>
          <div class="row"><b>CLASS</b><span id="tCls">—</span></div>
          <div class="row"><b>EPOCH</b><span id="tEpo">—</span></div>
          <div class="row"><b>RANGE</b><span id="tRng">—</span></div>
          <div class="row"><b>STATUS</b><span class="hot" id="tSta">—</span></div>
        </div>
        <div class="keys">
          <button class="key" id="prev">◀◀ PREV</button>
          <button class="key" id="next">NEXT ▶▶</button>
        </div>
        <div class="log" id="log">&gt; SCOPE ONLINE — SWEEPING…</div>
      </div>
    </div>
  </div>

<script>
(() => {
  const AMBER='#FFB000', ORANGE='#FF4400', BLUE='#3B5C7D', CARD='#F5F0E1', RED='#D93636';
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // lorem "projects" as bodies in 3D space (x,y,z in [-1,1])
  const BODIES = [
    { n:'LOREM-6',     des:'LI-1997', cls:'PORTFOLIO', epo:'2016', pos:[ .55,  .18, -.35] },
    { n:'IPSUM CORE',  des:'IC-0042', cls:'PLATFORM',  epo:'2019', pos:[-.62,  .05,  .30] },
    { n:'DOLOR RELAY', des:'DR-0777', cls:'SERVICE',   epo:'2021', pos:[ .12, -.42,  .58] },
    { n:'SIT PROBE',   des:'SP-0110', cls:'TOOLING',   epo:'2022', pos:[-.30,  .48, -.55] },
    { n:'AMET VAULT',  des:'AV-0207', cls:'STORAGE',   epo:'2023', pos:[ .72, -.15,  .22] },
    { n:'CONSECTETUR', des:'CN-1024', cls:'CLUSTER',   epo:'2024', pos:[-.18, -.28, -.70] },
    { n:'ADIPISCING',  des:'AD-2001', cls:'AGENT',     epo:'2025', pos:[ .05,  .62,  .40] },
  ];

  let W, H, CX, CY;
  function resize(){
    const r = cv.parentElement.getBoundingClientRect();
    cv.width = W = Math.floor(r.width * devicePixelRatio);
    cv.height = H = Math.floor(Math.max(r.height, 520) * devicePixelRatio);
    cv.style.height = Math.max(r.height, 520) + 'px';
    CX = W/2; CY = H/2;
  }
  resize(); addEventListener('resize', resize);

  // state
  let rot = 0.6;            // scene rotation
  let sweep = 0;            // radar beam angle
  let zoom = 1, zoomT = 1;  // camera zoom (eases toward zoomT)
  let sel = 0;              // selected body
  let lock = 0;             // 0..1 lock progress
  let mode = 'scan';        // scan | locking | locked
  let lockTimer = 0;

  const S = () => Math.min(W,H) * 0.36; // base scale

  const PITCH = 0.52; // camera tilt — rings project as ellipses, not lines
  function project(p, rotY){
    // rotate around Y, pitch around X, then simple perspective
    const [x,y,z] = p;
    const xr =  x*Math.cos(rotY) + z*Math.sin(rotY);
    const zr = -x*Math.sin(rotY) + z*Math.cos(rotY);
    const yp =  y*Math.cos(PITCH) - zr*Math.sin(PITCH);
    const zp =  y*Math.sin(PITCH) + zr*Math.cos(PITCH);
    const persp = 1.9 / (1.9 + zp);
    return { sx: CX + xr*S()*zoom*persp, sy: CY + yp*S()*zoom*persp, depth: zp, k: persp };
  }

  function ring(rx, ry, rotY, color, dash){
    ctx.beginPath();
    for(let a=0; a<=64; a++){
      const t = a/64*Math.PI*2;
      const p = project([Math.cos(t)*rx, 0, Math.sin(t)*rx], rotY);
      a ? ctx.lineTo(p.sx, p.sy) : ctx.moveTo(p.sx, p.sy);
    }
    ctx.strokeStyle = color; ctx.lineWidth = devicePixelRatio;
    ctx.setLineDash(dash || []);
    ctx.stroke(); ctx.setLineDash([]);
  }

  const ui = {
    state: document.getElementById('state'),
    name: document.getElementById('tName'), des: document.getElementById('tDes'),
    cls: document.getElementById('tCls'), epo: document.getElementById('tEpo'),
    rng: document.getElementById('tRng'), sta: document.getElementById('tSta'),
    log: document.getElementById('log'),
  };

  function setTarget(i, announce){
    sel = (i + BODIES.length) % BODIES.length;
    const b = BODIES[sel];
    ui.name.textContent = b.n; ui.des.textContent = b.des;
    ui.cls.textContent = b.cls; ui.epo.textContent = b.epo;
    ui.sta.textContent = 'LOCKING…';
    mode = 'locking'; lock = 0; zoomT = 1.55;
    if (announce) ui.log.innerHTML = `&gt; TGT ${b.des} — <span class="a">${b.n}</span><br>&gt; ZOOM-TO-LOCK ENGAGED`;
  }

  document.getElementById('next').onclick = () => setTarget(sel+1, true);
  document.getElementById('prev').onclick = () => setTarget(sel-1, true);

  function draw(dt){
    ctx.clearRect(0,0,W,H);
    const px = devicePixelRatio;

    // frame chrome
    ctx.strokeStyle = 'rgba(245,240,225,.18)'; ctx.lineWidth = px;
    ctx.strokeRect(14*px, 14*px, W-28*px, H-28*px);

    // rings + axis
    ring(1.0, 1, rot, 'rgba(59,92,125,.9)');
    ring(0.66, 1, rot, 'rgba(59,92,125,.55)', [4*px,5*px]);
    ring(0.33, 1, rot, 'rgba(59,92,125,.35)', [2*px,6*px]);
    const ax1 = project([0,-1,0], rot), ax2 = project([0,1,0], rot);
    ctx.beginPath(); ctx.moveTo(ax1.sx, ax1.sy); ctx.lineTo(ax2.sx, ax2.sy);
    ctx.strokeStyle = 'rgba(245,240,225,.25)'; ctx.stroke();

    // sweep beam (wedge)
    if (mode === 'scan') {
      const p1 = project([Math.cos(sweep), 0, Math.sin(sweep)], rot);
      ctx.beginPath(); ctx.moveTo(CX, CY); ctx.lineTo(p1.sx, p1.sy);
      ctx.strokeStyle = 'rgba(255,176,0,.6)'; ctx.lineWidth = 1.5*px; ctx.stroke();
      for (let t=1; t<=14; t++){
        const a = sweep - t*0.045;
        const p = project([Math.cos(a), 0, Math.sin(a)], rot);
        ctx.beginPath(); ctx.moveTo(CX, CY); ctx.lineTo(p.sx, p.sy);
        ctx.strokeStyle = `rgba(255,176,0,${.10 * (1 - t/14)})`; ctx.stroke();
      }
    }

    // bodies (painter order by depth)
    const projected = BODIES.map((b,i) => ({...project(b.pos, rot), b, i}))
      .sort((a,z) => z.depth - a.depth);

    projected.forEach(p => {
      const isSel = p.i === sel && mode !== 'scan';
      const r = (isSel ? 5.2 : 3.2) * p.k * px * (isSel ? (1 + lock*0.4) : 1);
      ctx.beginPath(); ctx.arc(p.sx, p.sy, r, 0, Math.PI*2);
      ctx.fillStyle = isSel ? ORANGE : AMBER;
      ctx.globalAlpha = 0.35 + 0.65 * p.k * 0.8;
      ctx.fill(); ctx.globalAlpha = 1;
      // designation tags
      ctx.font = `${10*px}px Nineteen, monospace`;
      ctx.fillStyle = isSel ? CARD : 'rgba(245,240,225,.45)';
      ctx.fillText(p.b.des, p.sx + 8*px, p.sy - 6*px);
    });

    // reticle on selected
    if (mode !== 'scan') {
      const t = projected.find(p => p.i === sel);
      if (t) {
        const g = (18 - lock*8) * px;
        ctx.strokeStyle = mode === 'locked' ? ORANGE : AMBER;
        ctx.lineWidth = 1.5*px;
        [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(([dx,dy]) => {
          ctx.beginPath();
          ctx.moveTo(t.sx + dx*g, t.sy + dy*g - dy*6*px);
          ctx.lineTo(t.sx + dx*g, t.sy + dy*g);
          ctx.lineTo(t.sx + dx*g - dx*6*px, t.sy + dy*g);
          ctx.stroke();
        });
        if (mode === 'locked') {
          ctx.font = `bold ${11*px}px Nineteen, monospace`;
          ctx.fillStyle = ORANGE;
          ctx.fillText('LOCK', t.sx - 14*px, t.sy + g + 14*px);
        }
        ui.rng.textContent = (1.9 + t.depth).toFixed(3) + ' AU';
      }
    }

    // corner readout
    ctx.font = `${10*px}px Nineteen, monospace`;
    ctx.fillStyle = 'rgba(245,240,225,.4)';
    ctx.fillText(`ROT ${(rot%(Math.PI*2)).toFixed(2)} // BODIES ${BODIES.length}`, 24*px, H - 26*px);
  }

  let prev = performance.now();
  function tick(now){
    const dt = Math.min((now - prev)/1000, .05); prev = now;
    if (!reduced) {
      rot += dt * (mode === 'locked' ? 0.05 : 0.12);
      sweep += dt * 1.4;
    }
    // zoom easing — mechanical, slightly sluggish
    zoom += (zoomT - zoom) * Math.min(1, dt*3);
    if (mode === 'locking') {
      lock = Math.min(1, lock + dt*1.6);
      if (lock >= 1) {
        mode = 'locked'; ui.sta.textContent = 'TRACKING';
        ui.state.textContent = 'LOCK'; ui.state.classList.add('lock');
        lockTimer = 0;
      }
    } else if (mode === 'locked') {
      lockTimer += dt;
      if (lockTimer > 3.4 && !reduced) {
        mode = 'scan'; zoomT = 1;
        ui.state.textContent = 'SCANNING'; ui.state.classList.remove('lock');
        setTimeout(() => setTarget(sel+1, true), 1400);
      }
    }
    draw(dt);
    requestAnimationFrame(tick);
  }

  // boot: start scanning, first lock shortly after
  setTimeout(() => setTarget(0, true), reduced ? 0 : 1600);
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
