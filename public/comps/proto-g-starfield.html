<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PROTO G — NAV Starfield (Real GitHub)</title>
<style>
  @font-face { font-family:'Heavitas'; src:url('/fonts/Heavitas.ttf'); }
  @font-face { font-family:'Nineteen'; src:url('/fonts/NineteenNinetySeven-11XB.ttf'); }
  :root{
    --black:#1A1A1A; --card:#F5F0E1; --amber:#FFB000;
    --orange:#FF4400; --red:#D93636; --blue:#3B5C7D;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:var(--black);color:var(--card);
    font-family:'Nineteen',monospace;min-height:100vh;padding:26px;
  }
  body::before{
    content:'';position:fixed;inset:0;z-index:40;pointer-events:none;
    background:repeating-linear-gradient(0deg, transparent 0 3px, rgba(0,0,0,.30) 3px 4px);
  }

  .frame{max-width:1080px;margin:0 auto;border:1px solid rgba(245,240,225,.25)}
  .mn{display:flex;align-items:stretch;border-bottom:1px solid rgba(245,240,225,.25)}
  .mn b{font-family:'Heavitas';font-size:22px;padding:8px 14px;background:var(--blue);color:var(--card)}
  .mn span{align-self:center;padding:0 12px;font-size:10px;letter-spacing:.3em;color:rgba(245,240,225,.6);text-transform:uppercase}
  .mn .st{margin-left:auto;align-self:center;padding:0 16px;font-size:11px;letter-spacing:.24em;color:var(--amber)}
  .mn .st.lock{color:var(--orange)}

  .grid{display:grid;grid-template-columns:1.6fr 1fr;min-height:560px}
  @media(max-width:820px){.grid{grid-template-columns:1fr}}
  .scope{position:relative;border-right:1px solid rgba(245,240,225,.25)}
  canvas{display:block;width:100%;height:100%;min-height:560px}

  .side{display:flex;flex-direction:column}
  .target{padding:22px 20px;border-bottom:1px solid rgba(245,240,225,.15)}
  .target .tg-name{font-family:'Heavitas';font-size:22px;color:var(--amber);min-height:28px;word-break:break-all}
  .target .row{display:flex;justify-content:space-between;font-size:12px;letter-spacing:.18em;padding:8px 0;border-bottom:1px solid rgba(245,240,225,.1)}
  .target .row b{font-weight:normal;color:rgba(245,240,225,.55);font-size:10px;letter-spacing:.28em}
  .target .row .hot{color:var(--orange)}
  .census{padding:16px 20px;font-size:11.5px;line-height:2.1;letter-spacing:.14em;border-bottom:1px solid rgba(245,240,225,.15);flex:1}
  .census b{color:var(--amber);font-weight:normal}
  .census .fk{color:var(--blue)}
  .keys{display:flex;gap:10px;padding:16px 20px}
  .key{
    font-family:'Heavitas';font-size:12px;letter-spacing:.08em;
    background:transparent;color:var(--card);border:2px solid rgba(245,240,225,.4);
    padding:9px 16px;cursor:pointer;flex:1;
  }
  .key:hover{border-color:var(--amber);color:var(--amber)}
  .log{padding:12px 20px;font-size:11px;line-height:1.9;color:rgba(245,240,225,.55);border-top:1px solid rgba(245,240,225,.15);letter-spacing:.06em;min-height:60px}
  .log .a{color:var(--amber)}
</style>
</head>
<body>
  <div class="frame">
    <div class="mn">
      <b>NAV</b><span>Sector Chart — All Known Bodies (Live Snapshot: github/mtgibbs)</span>
      <span class="st" id="state">SCANNING</span>
    </div>
    <div class="grid">
      <div class="scope"><canvas id="cv"></canvas></div>
      <div class="side">
        <div class="target">
          <div class="tg-name" id="tName">—</div>
          <div class="row"><b>CLASS</b><span id="tCls">—</span></div>
          <div class="row"><b>EPOCH</b><span id="tEpo">—</span></div>
          <div class="row"><b>LAST SIGNAL</b><span id="tSig">—</span></div>
          <div class="row"><b>STATUS</b><span class="hot" id="tSta">—</span></div>
        </div>
        <div class="census" id="census">CATALOGING…</div>
        <div class="keys">
          <button class="key" id="prev">◀◀ PREV</button>
          <button class="key" id="next">NEXT ▶▶</button>
        </div>
        <div class="log" id="log">&gt; SECTOR SCAN INITIATED…</div>
      </div>
    </div>
  </div>

<script>
(() => {
  const AMBER='#FFB000', ORANGE='#FF4400', BLUE='#3B5C7D', CARD='#F5F0E1';

  // ===== REAL DATA — snapshot of github.com/mtgibbs, 2026-07-04 =====
  const REPOS = [{"c":"2026","f":false,"l":"TypeScript","n":"ai-workflow-orchestrator","p":"2026-02-04","s":8},{"c":"2019","f":true,"l":"n/a","n":"anypull","p":"2019-10-11","s":9},{"c":"2026","f":false,"l":"TypeScript","n":"blackduck-polaris-mcp","p":"2026-02-27","s":769},{"c":"2026","f":false,"l":"TypeScript","n":"canvas-lms-mcp","p":"2026-02-13","s":309},{"c":"2026","f":false,"l":"TypeScript","n":"carl","p":"2026-01-14","s":276},{"c":"2016","f":false,"l":"JavaScript","n":"chartist-plugin-barlabels","p":"2017-04-05","s":32},{"c":"2016","f":false,"l":"JavaScript","n":"chartist-plugin-labelclasses","p":"2017-09-01","s":11},{"c":"2026","f":false,"l":"n/a","n":"claude-hiring-assistant","p":"2026-01-22","s":216},{"c":"2016","f":false,"l":"TypeScript","n":"d3-source-sink","p":"2016-10-04","s":17},{"c":"2018","f":true,"l":"TypeScript","n":"DefinitelyTyped","p":"2018-10-18","s":369127},{"c":"2015","f":false,"l":"CSS","n":"estudu","p":"2016-03-26","s":814},{"c":"2018","f":true,"l":"Java","n":"fod-uploader-java","p":"2018-10-18","s":246},{"c":"2013","f":false,"l":"Python","n":"FontAwesome3to4","p":"2013-11-19","s":124},{"c":"2019","f":true,"l":"n/a","n":"fortify-on-demand-uploader-plugin","p":"2019-10-11","s":629},{"c":"2015","f":false,"l":"JavaScript","n":"GamesDBdotNetGetter","p":"2015-06-18","s":132},{"c":"2015","f":false,"l":"C#","n":"GitStache","p":"2015-01-15","s":472},{"c":"2015","f":false,"l":"JavaScript","n":"gulp-less-branding-js","p":"2016-03-07","s":32},{"c":"2016","f":false,"l":"TypeScript","n":"hubot-fod","p":"2017-09-01","s":60},{"c":"2015","f":false,"l":"PowerShell","n":"inkscape-stroke-to-path","p":"2018-01-05","s":35},{"c":"2016","f":false,"l":"Python","n":"iot-gd","p":"2017-09-01","s":8},{"c":"2026","f":false,"l":"TypeScript","n":"kiwix-mcp","p":"2026-05-22","s":51},{"c":"2026","f":false,"l":"TypeScript","n":"local-llm-mcp","p":"2026-05-21","s":27},{"c":"2026","f":false,"l":"n/a","n":"mtgibbs","p":"2026-07-04","s":11342},{"c":"2016","f":false,"l":"CSS","n":"mtgibbs.github.io","p":"2016-02-26","s":18},{"c":"2016","f":false,"l":"TypeScript","n":"mtgibbs.xyz","p":"2026-07-04","s":1809},{"c":"2014","f":false,"l":"JavaScript","n":"NapkinTour","p":"2014-09-02","s":296},{"c":"2014","f":false,"l":"TypeScript","n":"NapkinTourTS","p":"2014-09-02","s":200},{"c":"2019","f":true,"l":"n/a","n":"nHydrate","p":"2019-10-18","s":28390},{"c":"2017","f":true,"l":"JavaScript","n":"node-typescript-compiler","p":"2016-08-15","s":12},{"c":"2014","f":false,"l":"TypeScript","n":"NodeWebScraper","p":"2014-08-29","s":208},{"c":"2025","f":false,"l":"Python","n":"pi-cluster","p":"2026-07-04","s":2070},{"c":"2026","f":false,"l":"TypeScript","n":"pi-cluster-mcp","p":"2026-06-10","s":288},{"c":"2026","f":true,"l":"Shell","n":"ralph","p":"2026-02-26","s":4801},{"c":"2026","f":false,"l":"TypeScript","n":"ralph-mcp","p":"2026-02-17","s":31},{"c":"2026","f":false,"l":"Python","n":"ralph-voice","p":"2026-02-17","s":40},{"c":"2019","f":false,"l":"JavaScript","n":"recipecate-api","p":"2024-08-03","s":181},{"c":"2019","f":false,"l":"TypeScript","n":"recipecate-ui","p":"2024-08-28","s":491},{"c":"2019","f":true,"l":"Groovy","n":"repository-permissions-updater","p":"2019-11-07","s":2384},{"c":"2026","f":false,"l":"n/a","n":"taskflow","p":"2026-02-21","s":27},{"c":"2018","f":true,"l":"JavaScript","n":"text-mask","p":"2018-10-18","s":4990},{"c":"2022","f":true,"l":"n/a","n":"umami","p":"2026-01-09","s":24085}];
  const PINNED = ["mtgibbs.xyz","hubot-fod","pi-cluster","claude-hiring-assistant","canvas-lms-mcp","pi-cluster-mcp"];
  // private repos appear as unnamed classified contacts — count only, no names
  const PRIVATE_COUNT = 5;
  // orientation aids: axis tripod is optional (off for now); the center
  // datum mark always shows so the orbit has an anchor
  const SHOW_AXES = false;
  // real relationships — signals move between related bodies
  const LINKS = [
    ["mtgibbs.xyz","pi-cluster"],       // the site deploys onto the cluster
    ["pi-cluster","pi-cluster-mcp"],    // the mcp watches the cluster
  ];

  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // deterministic hash → angle/elevation (positions MEAN something:
  // radius = age shell, brightness = signal recency, size = mass)
  const hash = s => { let h = 2166136261; for(const ch of s){ h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return (h >>> 0) / 4294967295; };
  const yearNorm = c => (Number(c) - 2013) / (2026 - 2013);
  const recency = p => { const y = Number(p.slice(0,4)) + Number(p.slice(5,7))/12; return Math.max(0, Math.min(1, (y - 2014) / (2026.6 - 2014))); };

  const bodies = REPOS.map(r => {
    const h1 = hash(r.n), h2 = hash(r.n + '*');
    const radius = 0.25 + yearNorm(r.c) * 0.72;
    const theta = h1 * Math.PI * 2;
    const pinned = PINNED.includes(r.n);
    return {
      ...r, pinned,
      pos: [Math.cos(theta)*radius, (h2 - .5) * 0.5, Math.sin(theta)*radius],
      theta,
      bright: 0.22 + recency(r.p) * 0.68,
      dot: Math.max(1.1, Math.min(2.6, Math.log10(Math.max(r.s,2)) * 0.85)) + (pinned ? 1.8 : 0),
    };
  });
  // classified contacts: deterministic positions, mid shells, no identity
  for (let i = 0; i < PRIVATE_COUNT; i++){
    const h1 = hash('classified-' + i), h2 = hash('classified*' + i);
    const radius = 0.45 + h2 * 0.45;
    const theta = h1 * Math.PI * 2;
    bodies.push({
      n: null, pinned: false, f: false, classified: true,
      pos: [Math.cos(theta)*radius, (hash('y'+i) - .5) * 0.5, Math.sin(theta)*radius],
      theta, bright: 0.7, dot: 1.9,
    });
  }

  const targets = bodies.filter(b => b.pinned);
  const linkPairs = LINKS.map(([a,b]) => [bodies.find(x=>x.n===a), bodies.find(x=>x.n===b)]).filter(p => p[0] && p[1]);

  let W,H,CX,CY;
  function resize(){
    const r = cv.parentElement.getBoundingClientRect();
    cv.width = W = Math.floor(r.width * devicePixelRatio);
    cv.height = H = Math.floor(Math.max(r.height,560) * devicePixelRatio);
    cv.style.height = Math.max(r.height,560) + 'px';
    CX = W/2; CY = H/2;
  }
  resize(); addEventListener('resize', resize);

  let rot = 0.6, zoom = 1, zoomT = 1, sel = 0, lock = 0, lockTimer = 0, pulse = 0;
  let ox = 0, oy = 0; // camera pan — lock centers its target
  let mode = 'scan';
  let manual = false; // once the user takes control, auto-cycling stops
  const S = () => Math.min(W,H) * 0.42;
  const PITCH = 0.52;

  function project(p){
    const [x,y,z] = p;
    const xr =  x*Math.cos(rot) + z*Math.sin(rot);
    const zr = -x*Math.sin(rot) + z*Math.cos(rot);
    const yp =  y*Math.cos(PITCH) - zr*Math.sin(PITCH);
    const zp =  y*Math.sin(PITCH) + zr*Math.cos(PITCH);
    const k = 1.9 / (1.9 + zp);
    return { sx: CX + ox + xr*S()*zoom*k, sy: CY + oy + yp*S()*zoom*k, depth: zp, k };
  }

  function ring(r, color, dash){
    const px = devicePixelRatio;
    ctx.beginPath();
    for(let a=0; a<=72; a++){
      const t = a/72*Math.PI*2;
      const p = project([Math.cos(t)*r, 0, Math.sin(t)*r]);
      a ? ctx.lineTo(p.sx,p.sy) : ctx.moveTo(p.sx,p.sy);
    }
    ctx.strokeStyle = color; ctx.lineWidth = px; ctx.setLineDash(dash||[]); ctx.stroke(); ctx.setLineDash([]);
  }

  const ui = {
    state: document.getElementById('state'), name: document.getElementById('tName'),
    cls: document.getElementById('tCls'), epo: document.getElementById('tEpo'),
    sig: document.getElementById('tSig'), sta: document.getElementById('tSta'),
    log: document.getElementById('log'), census: document.getElementById('census'),
  };

  const forks = bodies.filter(b => b.f).length;
  ui.census.innerHTML =
    `BODIES CHARTED <b>${bodies.length}</b><br>` +
    `NAVIGABLE <b>${targets.length}</b> // PINNED<br>` +
    `<span class="fk">DERELICT ${forks} // FORKED HULLS</span><br>` +
    `<span style="color:var(--red)">CLASSIFIED ${PRIVATE_COUNT} // SIGNAL WITHHELD</span><br>` +
    `SIGNALS <b>${linkPairs.length}</b> // UPLINKS ACTIVE<br>` +
    `SHELLS 2013 (CORE) → 2026 (RIM)`;

  function setTarget(i, announce){
    sel = (i + targets.length) % targets.length;
    const b = targets[sel];
    ui.name.textContent = b.n;
    ui.cls.textContent = (b.l === 'n/a' ? 'MIXED' : b.l).toUpperCase();
    ui.epo.textContent = b.c;
    ui.sig.textContent = b.p;
    ui.sta.textContent = 'LOCKING…';
    mode = 'locking'; lock = 0; zoomT = 1.5;
    if (announce) ui.log.innerHTML = `&gt; TGT — <span class="a">${b.n}</span><br>&gt; ZOOM-TO-LOCK ENGAGED`;
  }
  document.getElementById('next').onclick = () => { manual = true; setTarget(sel+1, true); };
  document.getElementById('prev').onclick = () => { manual = true; setTarget(sel-1, true); };

  function draw(){
    const px = devicePixelRatio;
    ctx.clearRect(0,0,W,H);
    ctx.strokeStyle='rgba(245,240,225,.18)'; ctx.lineWidth=px;
    ctx.strokeRect(14*px,14*px,W-28*px,H-28*px);

    // age shells
    ring(0.97, 'rgba(59,92,125,.75)');
    ring(0.62, 'rgba(59,92,125,.42)', [4*px,5*px]);
    ring(0.30, 'rgba(59,92,125,.28)', [2*px,6*px]);

    // world origin — the datum everything orbits
    const o = project([0,0,0]);
    if (SHOW_AXES){
      // optional orientation tripod (off by default)
      [
        { v:[1.12,0,0], c:'rgba(255,176,0,.45)',  t:'X' },
        { v:[0,1.02,0], c:'rgba(245,240,225,.40)', t:'Y' },
        { v:[0,0,1.12], c:'rgba(59,130,246,.50)',  t:'Z' },
      ].forEach(ax => {
        const p = project(ax.v);
        ctx.beginPath(); ctx.moveTo(o.sx,o.sy); ctx.lineTo(p.sx,p.sy);
        ctx.strokeStyle = ax.c; ctx.lineWidth = px; ctx.stroke();
        ctx.font = `${10*px}px Nineteen, monospace`;
        ctx.fillStyle = ax.c;
        ctx.fillText(ax.t, p.sx + 5*px, p.sy - 4*px);
      });
    }
    // center datum mark — small crosshair + dot
    ctx.strokeStyle = 'rgba(245,240,225,.5)'; ctx.lineWidth = px;
    ctx.beginPath();
    ctx.moveTo(o.sx - 8*px, o.sy); ctx.lineTo(o.sx - 3*px, o.sy);
    ctx.moveTo(o.sx + 3*px, o.sy); ctx.lineTo(o.sx + 8*px, o.sy);
    ctx.moveTo(o.sx, o.sy - 8*px); ctx.lineTo(o.sx, o.sy - 3*px);
    ctx.moveTo(o.sx, o.sy + 3*px); ctx.lineTo(o.sx, o.sy + 8*px);
    ctx.stroke();
    ctx.beginPath(); ctx.arc(o.sx, o.sy, 1.6*px, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(255,176,0,.8)'; ctx.fill();

    // uplink signals — faint line + moving pulse
    linkPairs.forEach(([a,b],li) => {
      const pa = project(a.pos), pb = project(b.pos);
      ctx.beginPath(); ctx.moveTo(pa.sx,pa.sy); ctx.lineTo(pb.sx,pb.sy);
      ctx.strokeStyle = 'rgba(255,176,0,.16)'; ctx.lineWidth = px; ctx.setLineDash([3*px,5*px]); ctx.stroke(); ctx.setLineDash([]);
      const t = (pulse + li*0.5) % 1;
      const mx = pa.sx + (pb.sx-pa.sx)*t, my = pa.sy + (pb.sy-pa.sy)*t;
      ctx.beginPath(); ctx.arc(mx,my,1.8*px,0,Math.PI*2);
      ctx.fillStyle = AMBER; ctx.globalAlpha = .85; ctx.fill(); ctx.globalAlpha = 1;
    });

    // bodies — painter order
    const proj = bodies.map(b => ({...project(b.pos), b}))
      .sort((a,z) => z.depth - a.depth);

    proj.forEach(p => {
      const b = p.b;
      const isSel = b.pinned && targets[sel] === b && mode !== 'scan';
      const r = (isSel ? b.dot*1.4 : b.dot) * p.k * px;
      ctx.beginPath(); ctx.arc(p.sx, p.sy, r, 0, Math.PI*2);
      ctx.globalAlpha = Math.max(0.28, Math.min(1, (b.pinned ? .95 : b.bright*.75) * (0.5 + p.k*0.5)));
      if (b.classified){
        // classified contact — open circle, no fill, no name
        ctx.strokeStyle = 'rgba(217,54,54,.8)'; ctx.lineWidth = px;
        ctx.stroke();
      } else {
        ctx.fillStyle = isSel ? ORANGE : (b.f ? BLUE : AMBER);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      if (b.pinned){
        ctx.font = `${10*px}px Nineteen, monospace`;
        ctx.fillStyle = isSel ? CARD : 'rgba(245,240,225,.55)';
        ctx.fillText(b.n, p.sx + 8*px, p.sy - 6*px);
      }
    });

    // reticle
    if (mode !== 'scan'){
      const t = proj.find(p => p.b === targets[sel]);
      if (t){
        const g = (18 - lock*8)*px;
        ctx.strokeStyle = mode==='locked' ? ORANGE : AMBER; ctx.lineWidth = 1.5*px;
        [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(([dx,dy]) => {
          ctx.beginPath();
          ctx.moveTo(t.sx+dx*g, t.sy+dy*g-dy*6*px);
          ctx.lineTo(t.sx+dx*g, t.sy+dy*g);
          ctx.lineTo(t.sx+dx*g-dx*6*px, t.sy+dy*g);
          ctx.stroke();
        });
        if (mode==='locked'){
          ctx.font = `bold ${11*px}px Nineteen, monospace`;
          ctx.fillStyle = ORANGE; ctx.fillText('LOCK', t.sx-14*px, t.sy+g+14*px);
        }
      }
    }

    ctx.font = `${10*px}px Nineteen, monospace`;
    ctx.fillStyle = 'rgba(245,240,225,.4)';
    ctx.fillText(`ROT ${(rot%(Math.PI*2)).toFixed(2)} // BODIES ${bodies.length} // SNAPSHOT 2026-07-04`, 24*px, H-26*px);
  }

  let prev = performance.now();
  function tick(now){
    const dt = Math.min((now-prev)/1000,.05); prev = now;
    if (!reduced){ rot += dt*(mode==='locked'?0.03:0.07); pulse = (pulse + dt*0.25) % 1; }
    zoom += (zoomT - zoom)*Math.min(1, dt*3);
    // pan the camera so the locked body rides to center; drift home on scan
    if (mode !== 'scan'){
      const t = project(targets[sel].pos);
      ox += (CX - t.sx) * Math.min(1, dt*2.6);
      oy += (CY - t.sy) * Math.min(1, dt*2.6);
    } else {
      ox += (0 - ox) * Math.min(1, dt*2);
      oy += (0 - oy) * Math.min(1, dt*2);
    }
    if (mode==='locking'){
      lock = Math.min(1, lock + dt*1.6);
      if (lock>=1){ mode='locked'; ui.sta.textContent='TRACKING'; ui.state.textContent='LOCK'; ui.state.classList.add('lock'); lockTimer=0; }
    } else if (mode==='locked'){
      lockTimer += dt;
      // demo mode only: auto-advance until the user takes control
      if (lockTimer>3.6 && !reduced && !manual){
        mode='scan'; zoomT=1;
        ui.state.textContent='SCANNING'; ui.state.classList.remove('lock');
        setTimeout(() => { if (!manual) setTarget(sel+1,true); }, 1500);
      }
    }
    draw();
    requestAnimationFrame(tick);
  }
  setTimeout(() => setTarget(0,true), reduced ? 0 : 1800);
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
